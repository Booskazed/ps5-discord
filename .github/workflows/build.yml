# Full community build of ps5-discord: the app package with everything inside (core with libdave,
# FFmpeg's AAC decoder, the capture helper, the overlay, the app), in two editions built side by side:
#
#   stock         title PPSA99072, data in /data/ps5-discord. Replaces upstream's own install, as an
#                 upstream release would (README "Fork notes").
#   side-by-side  title PPSA99073, data in /data/ps5-discord-community, no updater. Installs next to
#                 the stock one and never reads or writes its files, so the original stays as it is
#                 (only one of the two can run at a time: both cores use port 9041).
#
#   - every push to `community`, and a manual run (Actions > build > Run workflow);
#   - a tag `v<VERSION>` also publishes a GitHub prerelease with both editions and the CHANGELOG notes.
#
# Jobs: `dave` and `ffmpeg` build the two slow libraries once and cache them (a cache hit skips
# the build), then `build` (one job per edition) compiles, tests and packages, and `release` (tags
# only) publishes. GitHub scopes caches by ref: a tag build cannot read the ones made on
# `community`, so the first build of a new tag rebuilds libdave (a few minutes).
#
# The built-in updater is left alone in the stock edition: it reads the upstream repository's
# releases and trusts only upstream's keys, so this workflow publishes no update.txt or update.sig.
name: build

on:
  push:
    branches: [community]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A new push waits for the running build instead of cancelling libdave half-way.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dave:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Cache libdave (OpenSSL, mlspp, libdave for the PS5 and the host)
        id: cache
        uses: actions/cache@v6
        with:
          path: .deps/dave
          key: dave-${{ hashFiles('tools/dave/**') }}
      - name: Build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake ninja-build perl unzip curl wget python3 git xz-utils ca-certificates
          for t in ar ranlib; do
            command -v llvm-$t >/dev/null || sudo ln -s "$(ls /usr/bin/llvm-$t-* | sort -V | tail -1)" /usr/local/bin/llvm-$t
          done
          clang --version | head -1
          cmake --version | head -1
          ninja --version
      - name: make deps (the SDK libdave builds with)
        if: steps.cache.outputs.cache-hit != 'true'
        run: make deps
      - name: make dave (slow)
        if: steps.cache.outputs.cache-hit != 'true'
        run: make dave
      - name: Check the libraries
        run: |
          for t in ps5 host; do
            test -s ".deps/dave/install/$t/lib/libdave.a" || { echo "::error::libdave for $t is missing"; exit 1; }
          done

  ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Cache FFmpeg's AAC decoder (the AirPods microphone)
        id: cache
        uses: actions/cache@v6
        with:
          path: .deps/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/ffmpeg/**') }}
      - name: Build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake ninja-build perl unzip curl wget python3 git xz-utils ca-certificates
          for t in ar ranlib; do
            command -v llvm-$t >/dev/null || sudo ln -s "$(ls /usr/bin/llvm-$t-* | sort -V | tail -1)" /usr/local/bin/llvm-$t
          done
      - name: make deps (the SDK FFmpeg builds with)
        if: steps.cache.outputs.cache-hit != 'true'
        run: make deps
      - name: make ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: make ffmpeg
      - name: Check the libraries
        run: |
          test -s .deps/ffmpeg/install/ps5/lib/libavcodec.a || { echo "::error::FFmpeg for the PS5 is missing"; exit 1; }

  build:
    needs: [dave, ffmpeg]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: stock
            package_id: PPSA99072
            edition_title_id: ''
            edition_data_dir: ''
          - edition: side-by-side
            package_id: PPSA99073
            edition_title_id: PPSA99073
            edition_data_dir: /data/ps5-discord-community
    env:
      EDITION: ${{ matrix.edition }}
      PACKAGE_ID: ${{ matrix.package_id }}
      # Read by the Makefiles (root, capture, overlay, tools/vpad-probe); empty for the stock edition.
      EDITION_TITLE_ID: ${{ matrix.edition_title_id }}
      EDITION_DATA_DIR: ${{ matrix.edition_data_dir }}
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm cmake ninja-build perl unzip curl wget python3 git xz-utils ca-certificates
          for t in ar ranlib; do
            command -v llvm-$t >/dev/null || sudo ln -s "$(ls /usr/bin/llvm-$t-* | sort -V | tail -1)" /usr/local/bin/llvm-$t
          done
      - name: Restore libdave
        uses: actions/cache/restore@v6
        with:
          path: .deps/dave
          key: dave-${{ hashFiles('tools/dave/**') }}
          fail-on-cache-miss: true
      - name: Restore FFmpeg
        uses: actions/cache/restore@v6
        with:
          path: .deps/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/ffmpeg/**') }}
          fail-on-cache-miss: true
      - name: Check the version
        run: |
          version=$(cat VERSION)
          # Never -dev: the app replaces a -dev+g<commit> core with the one it embeds.
          case "$version" in
            *-dev*) echo "::error::VERSION $version contains -dev"; exit 1 ;;
          esac
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version (expected v$version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Building $version, edition $EDITION ($PACKAGE_ID)"
      - name: Give the app its own identity (side-by-side edition)
        if: matrix.edition == 'side-by-side'
        run: |
          # The kit's own tool: titleId, conceptId, contentId and the name shown on the home screen.
          make -C app init TITLE_ID="$PACKAGE_ID" APP_NAME="ps5-discord (community)"
          grep -F "\"titleId\": \"$PACKAGE_ID\"" app/sce_sys/param.json
      - name: make deps (SDK, mbedTLS, zlib, opus, cJSON, qrcodegen, SQLite, certificates, adapter firmware)
        run: make deps
      - name: Core, capture helper and overlay (make RELEASE=1 CORE_LAN=0 all)
        run: |
          set -o pipefail
          mkdir -p out
          make RELEASE=1 CORE_LAN=0 all 2>&1 | tee out/build.log
      - name: Fail if libdave or FFmpeg was left out
        run: |
          if grep -q 'no-DAVE stub' out/build.log; then
            echo "::error::the core was built with the no-DAVE stub: every voice call would fail (code 4017)"
            exit 1
          fi
          if grep -q 'FFmpeg for the PS5 is missing' out/build.log; then
            echo "::error::the core was built without FFmpeg: the AirPods microphone would not decode"
            exit 1
          fi
          if grep -a -q -F "$VERSION-dev" build/ps5-discord.elf; then
            echo "::error::the core announces a -dev version; the app would replace it with its own"
            exit 1
          fi
          grep -a -q -F "$VERSION" build/ps5-discord.elf || { echo "::error::the core does not announce $VERSION"; exit 1; }
          for f in build/ps5-discord.elf capture/build/discord-capture.elf overlay/build/overlay-service.elf overlay/build/overlay-restart.elf overlay/build/overlay.build; do
            test -s "$f" || { echo "::error::$f was not built"; exit 1; }
          done
      - name: The side-by-side edition leaves the stock install alone
        if: matrix.edition == 'side-by-side'
        run: |
          # None of its programs may name the stock title's folders or the stock data folder.
          for f in build/ps5-discord.elf capture/build/discord-capture.elf overlay/build/overlay-service.elf overlay/build/overlay-restart.elf; do
            for stock in /data/homebrew/PPSA99072 /data/homebrew/.PPSA99072 /user/appmeta/PPSA99072 /user/app/PPSA99072 /user/data/homebrew/PPSA99072; do
              if grep -a -q -F -- "$stock" "$f"; then
                echo "::error::$f still names the stock install: $stock"
                exit 1
              fi
            done
            # The stock data folder, alone or followed by a path ("/data/ps5-discord-community" is fine).
            if LC_ALL=C grep -a -q -P '/data/ps5-discord(/|\x00)' "$f"; then
              echo "::error::$f still names the stock data folder /data/ps5-discord"
              exit 1
            fi
          done
          grep -a -q -F "/data/homebrew/$EDITION_TITLE_ID" build/ps5-discord.elf || { echo "::error::the core does not use /data/homebrew/$EDITION_TITLE_ID"; exit 1; }
          grep -a -q -F "$EDITION_DATA_DIR" build/ps5-discord.elf || { echo "::error::the core does not use $EDITION_DATA_DIR"; exit 1; }
          grep -a -q -F "$EDITION_DATA_DIR" capture/build/discord-capture.elf || { echo "::error::the capture helper does not use $EDITION_DATA_DIR"; exit 1; }
          grep -a -q -F "/user/data/homebrew/$EDITION_TITLE_ID" overlay/build/overlay-service.elf || { echo "::error::the overlay does not read /user/data/homebrew/$EDITION_TITLE_ID"; exit 1; }
      - name: make test (host self-checks, with libdave)
        if: matrix.edition == 'stock'
        run: |
          set -o pipefail
          make test 2>&1 | tee out/test.log
      - name: App package (cd app && make deps && RELEASE=1 make)
        env:
          # lab/audio-out-probe only, never on community: bakes in the debug
          # audio-out probe (app/src/platform/ps5/audio_out_probe.cpp).
          APP_DEFINITIONS: HUI_AUDIO_PROBE
        run: |
          set -o pipefail
          cd app
          make deps 2>&1 | tee ../out/app-deps.log
          RELEASE=1 make 2>&1 | tee ../out/app-build.log
      - name: Check the package and collect the files
        run: |
          d=app/dist/$PACKAGE_ID
          for f in eboot.bin version.txt assets/ps5-discord.elf assets/discord-capture.elf assets/overlay.elf assets/overlay-restart.elf assets/overlay.build assets/controller-audio.elf firmware/rtl8761bu_fw.bin; do
            test -s "$d/$f" || { echo "::error::$f is missing or empty in the app package"; exit 1; }
          done
          test "$(cat "$d/version.txt")" = "$VERSION" || { echo "::error::version.txt is not $VERSION"; exit 1; }
          grep -F "\"titleId\": \"$PACKAGE_ID\"" "$d/sce_sys/param.json" || { echo "::error::param.json is not the title $PACKAGE_ID"; exit 1; }
          cmp build/ps5-discord.elf "$d/assets/ps5-discord.elf" || { echo "::error::the app embeds another core than the one just built"; exit 1; }
          if [[ $EDITION == side-by-side ]]; then
            for f in assets/controller-audio.elf eboot.bin; do
              for stock in /data/homebrew/PPSA99072 PPSA99072; do
                if grep -a -q -F -- "$stock" "$d/$f"; then
                  echo "::error::$f of the side-by-side edition still names the stock install: $stock"
                  exit 1
                fi
              done
              if LC_ALL=C grep -a -q -P '/data/ps5-discord(/|\x00)' "$d/$f"; then
                echo "::error::$f of the side-by-side edition still names the stock data folder"
                exit 1
              fi
            done
            grep -a -q -F "$EDITION_DATA_DIR" "$d/assets/controller-audio.elf" || { echo "::error::controller-audio.elf does not use $EDITION_DATA_DIR"; exit 1; }
          fi
          test -s "app/dist/$PACKAGE_ID.zip" || { echo "::error::app/dist/$PACKAGE_ID.zip is missing"; exit 1; }
          mkdir -p out/release
          cp "app/dist/$PACKAGE_ID.zip" build/ps5-discord.elf out/release/
          # lab/audio-out-probe only, never on community: standalone lab tool,
          # never packaged into the app, sent to elfldr by hand.
          [[ -s overlay/build/overlay-audiotest.elf ]] && cp overlay/build/overlay-audiotest.elf out/release/
          (cd out/release && sha256sum "$PACKAGE_ID.zip" ps5-discord.elf > SHA256SUMS && cat SHA256SUMS)
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_id }}-${{ env.VERSION }}-run${{ github.run_number }}
          path: out/release/
          retention-days: 30
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.edition }}-run${{ github.run_number }}
          path: out/*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: PPSA*
          path: dl
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          [[ $GITHUB_REF_NAME == "v$version" ]] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          stock=$(ls -d dl/PPSA99072-*/ | head -n 1)
          side=$(ls -d dl/PPSA99073-*/ | head -n 1)
          mkdir -p assets
          cp "${stock}PPSA99072.zip" "assets/ps5-discord-app-v$version.zip"
          cp "${stock}ps5-discord.elf" "assets/ps5-discord-core-v$version.elf"
          cp "${side}PPSA99073.zip" "assets/ps5-discord-app-v$version-side-by-side.zip"
          cp "${side}ps5-discord.elf" "assets/ps5-discord-core-v$version-side-by-side.elf"
          (cd assets && sha256sum ps5-discord-* > SHA256SUMS && cat SHA256SUMS)
          # The CHANGELOG section of this version, else [Unreleased].
          section() { awk -v h="## [$1]" 'index($0, h) == 1 { p = 1; next } /^## \[/ { p = 0 } p' CHANGELOG.md; }
          notes=$(section "$version")
          [[ -n ${notes//[[:space:]]/} ]] || notes=$(section Unreleased)
          {
            echo "Community build of ps5-discord, from the fork $GITHUB_REPOSITORY. Not published or signed by the upstream author."
            echo
            echo "Two editions, same code:"
            echo "- \`ps5-discord-app-v$version.zip\`: the stock title PPSA99072. It replaces an existing install; the built-in updater only offers upstream releases, and installing one replaces this build."
            echo "- \`ps5-discord-app-v$version-side-by-side.zip\`: its own title PPSA99073 and data folder /data/ps5-discord-community, no updater. It installs next to the stock app and never touches its files; sign in again once. Quit one app (Settings > Account > Quit) before starting the other: both cores use port 9041."
            echo
            echo "Install: copy the folder inside the zip into /data/homebrew (app closed, core stopped)."
            echo
            echo "$notes"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME (community build)" --notes-file notes.md
